    <title>TORNE Explorer</title>
    <script>
      /*
       * The skin is decided before the first paint.
       *
       * The tokens follow the operating system's preference by default, and an
       * explicit choice — light or dark — is stored under this key. An
       * instrument does not flash the wrong skin on the way in, so the choice
       * is applied here, in the head, before anything is drawn. The key is
       * `torne.theme`, the one `ThemeProvider` writes; `tests/unit/app/theme.test.ts`
       * holds the two together.
       */
      (function () {
        try {
          var stored = window.localStorage.getItem('torne.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* A browser that refuses local storage still gets the system skin. */
        }
      })();
    </script>
