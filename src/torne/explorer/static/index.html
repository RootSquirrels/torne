<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TORNE Explorer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">TORNE Explorer</span>
      <span class="brand-sub">what the system has really established</span>
    </div>
    <nav class="spaces" aria-label="Spaces">
      <button class="space active" type="button" aria-pressed="true">World Intelligence</button>
      <button class="space" type="button" disabled title="Deferred until the physical engine is validated">
        Market Intelligence <span class="soon">deferred</span>
      </button>
    </nav>
  </header>

  <section class="filters" aria-label="Filters">
    <label>Domain
      <select id="filter-domain"><option value="">All domains</option></select>
    </label>
    <label>Minimum status
      <select id="filter-status"><option value="">Any status</option></select>
    </label>
    <label>Asset kind
      <select id="filter-kind">
        <option value="">All kinds</option>
        <option value="station">Stations</option>
        <option value="catchment">Catchments</option>
        <option value="raster_coverage">Raster coverages</option>
      </select>
    </label>
    <label class="planned" title="Planned: needs persisted knowledge records">Period
      <select disabled><option>planned</option></select>
    </label>
    <label class="planned" title="Planned: needs persisted knowledge records">Uncertainty
      <select disabled><option>planned</option></select>
    </label>
    <button id="filter-reset" type="button" class="reset">Reset</button>
  </section>

  <main class="layout">
    <div id="map" class="map" role="region" aria-label="Map of Europe"></div>
    <aside id="panel" class="panel" aria-live="polite"></aside>
  </main>

  <footer class="legend" id="legend" aria-label="Status legend"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
