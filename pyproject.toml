[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torne"
version = "0.1.0"
description = "Plateforme computationnelle de connaissance du monde reel (World Intelligence / World-to-Market Intelligence)."
readme = "README.md"
# Version de reference : 3.12, le plancher declare. L'outillage suit la meme
# version (ruff target-version = "py312", CI sur 3.12) ; le verrou uv.lock reste
# multi-version et vaut aussi pour 3.13 et 3.14.
requires-python = ">=3.12"

# Dependances de runtime : la premiere dependance reellement importee par le
# depot. Regle du programme : une bibliotheque s'installe quand un module du
# depot l'importe reellement ; sa presence dans un document d'architecture ne
# suffit pas.
#
# numpy est requis par le calcul scientifique (filtrage d'etat, estimateurs
# statistiques repris) ; scipy est requis par la loi de Student
# (`scipy.stats.t.cdf`) et par la loi non centrale de Student qui donne la
# puissance exacte d'un test t : ces primitives etablies ne sont pas
# reimplementees. Le reste du socle n'ecrit que de la bibliotheque standard.
# Les candidates restantes (pandas, pyarrow, duckdb, scikit-learn, requests,
# pyyaml, pydantic) reviendront au premier import reel, phase par phase : le
# detail figure dans docs/PROGRAMME.md.
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
]

[project.scripts]
# Point d'entree console provisoire : il ne fait qu'etatiser le paquet. Aucun code
# metier ici tant que le premier slice vertical n'est pas choisi.
torne = "torne:main"

[dependency-groups]
# Dependances de developpement : elles ne sont jamais importees par le paquet
# installe, elles servent aux tests. `statsmodels` y figure pour une raison
# precise et verifiee : il fournit un **oracle independant** a trois
# implementations de TORNE (filtre de Kalman en tendance lineaire locale,
# variance de long terme HAC, erreur-type CR1 groupe). Les etats du filtre de
# statsmodels sont initialises de facon diffuse ; l'alignement avec
# l'initialisation exacte de TORNE se fait en donnant a statsmodels le meme
# etat anterieur (apres la premiere transition), et l'ecart mesure tombe sous
# 1e-9. La comparaison par simple beginning de serie n'aurait pas ete
# justifiable : elle depend de la convention d'initialisation.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "statsmodels>=0.14",
]

[tool.uv]
# Le verrou produit par uv 0.13 porte la revision 5 : un uv plus ancien ne sait pas
# le lire. On le refuse explicitement plutot que de laisser croire a une
# reproduction exacte.
required-version = ">=0.13.6"

[tool.hatch.build.targets.wheel]
packages = ["src/torne"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Regles explicitement selectionnees : la configuration ne doit pas dependre
# des defauts d'une version de ruff, qui changent. Une liste explicite rend le
# gate de lint reproductible au-dela du verrou de dependances.
#
# E4/E7/E9 = erreurs pycodestyle hors longueur de ligne (celle-ci est traitee
# par le formateur) ; F = pyflakes ; I = tri des imports ; UP = modernisation ;
# B = bugbear ; SIM = simplifications ; RUF = regles propres a ruff ;
# C4/PIE = comprehension et divers ; PT = style pytest ; T20 = pas de print().
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT", "T20"]

[tool.ruff.lint.per-file-ignores]
# Les scripts d'execution demonstrate : ils doivent pouvoir ecrire a l'ecran.
"experiments/**/*.py" = ["T201"]
# Les tests utilisent des assertions : c'est leur mode d'expression normal.
"tests/**/*.py" = ["T201"]
# Le point d'entree console doit, par nature, ecrire sur la sortie standard.
"src/torne/__init__.py" = ["T201"]

