[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "torne"
version = "0.1.0"
description = "Plateforme computationnelle de connaissance du monde reel (World Intelligence / World-to-Market Intelligence)."
readme = "README.md"
# Version de reference : 3.12, le plancher declare. L'outillage suit la meme
# version (ruff target-version = "py312", CI sur 3.12) ; le verrou uv.lock reste
# multi-version et vaut aussi pour 3.13 et 3.14.
requires-python = ">=3.12"

# Aucune dependance de runtime : le socle n'ecrit que de la bibliotheque standard.
# Regle du programme : une bibliotheque s'installe quand un module du depot
# l'importe reellement ; sa presence dans un document d'architecture ne suffit
# pas. Les candidates retirees (numpy, pandas, pyarrow, duckdb, scikit-learn,
# requests, pyyaml, pydantic) reviendront au premier import reel, phase par
# phase : le detail figure dans docs/P0-RAPPORT.md.
dependencies = []

[project.scripts]
# Point d'entree console provisoire : il ne fait qu'etatiser le paquet. Aucun code
# metier ici tant que le premier slice vertical n'est pas choisi.
torne = "torne:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# Le verrou produit par uv 0.13 porte la revision 5 : un uv plus ancien ne sait pas
# le lire. On le refuse explicitement plutot que de laisser croire a une
# reproduction exacte.
required-version = ">=0.13.6"

[tool.hatch.build.targets.wheel]
packages = ["src/torne"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
